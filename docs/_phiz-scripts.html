<style>.phiz-figure{margin:0.5rem 0 1.5rem;overflow-x:auto}</style>
<script src="https://cdn.jsdelivr.net/npm/vega@6.4.0/build/vega.min.js" integrity="sha384-VKdcJr3ZaBIJMbVcopTAI/JEuUkSY6qnwVu9iLuw0DnQ9gQ1JjsfZJhXFQAgNi43" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-lite@6.4.3/build/vega-lite.min.js" integrity="sha384-9/70gNCfOu6G7xXvkdreMfuqAEsoaGJVXV2BN/JLRXkSmcGvnMqtsRx8HZtUWAvI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/vega-embed@7.3.0/build/vega-embed.min.js" integrity="sha384-Muy1QRxYFeNrA1zShc1KtN4OfipkR/61gt+HWqN57c1Zxu3Oe16TsilsruVVjfKL" crossorigin="anonymous"></script>
<script>/*
 * phiz: renders [data-phiz] elements with vega-embed, and re-renders when their spec changes (Livewire morphs).
 * A [data-phiz-deferred] element fetches its spec from its [data-phiz-spec] link when it nears the viewport, then
 * renders like any other.
 *
 * The page is dark when <html> has the class dark, or, with the theme: 'auto' option, when the system prefers dark.
 * A dark page gets each spec's dark variant (usermeta.phiz.dark) merged over its config, sequential schemes trimmed of
 * their darkest end, faint points lifted, and dark tooltips. Charts redraw when the page switches.
 */
(function () {
  if (window.Phiz) return;
  var views = new WeakMap();
  var dark = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  function parse(json, fallback) {
    if (!json) return fallback;
    try { return JSON.parse(json); } catch (e) { console.error('phiz: invalid JSON', e); return fallback; }
  }

  function pageDark(options) {
    return document.documentElement.classList.contains('dark') || (options.theme === 'auto' && !!dark && dark.matches);
  }

  // Merges objects recursively; arrays and scalars in the override replace the base's.
  function merge(base, override) {
    var out = {};
    Object.keys(base || {}).forEach(function (k) { out[k] = base[k]; });
    Object.keys(override).forEach(function (k) {
      var b = out[k], o = override[k];
      out[k] = o && typeof o === 'object' && !Array.isArray(o) && b && typeof b === 'object' && !Array.isArray(b) ? merge(b, o) : o;
    });
    return out;
  }

  // Sequential schemes whose darkest colors sink into a dark page: those that start dark, and those that end dark.
  var startsDark = ['viridis', 'magma', 'inferno', 'plasma', 'cividis', 'turbo'];
  var endsDark = ['blues', 'greens', 'greys', 'oranges', 'purples', 'reds', 'bluegreen', 'bluepurple', 'greenblue', 'orangered',
    'purpleblue', 'purplebluegreen', 'purplered', 'redpurple', 'yellowgreen', 'yellowgreenblue', 'yelloworangebrown', 'yelloworangered'];

  // Adapts a spec for a dark page: trims the dark end of sequential schemes, and lifts faint points.
  function darken(node) {
    if (Array.isArray(node)) { node.forEach(darken); return; }
    if (!node || typeof node !== 'object') return;
    var scheme = node.scheme;
    var name = typeof scheme === 'string' ? scheme : (scheme && typeof scheme === 'object' && !scheme.extent ? scheme.name : null);
    if (typeof name === 'string') {
      var lower = name.toLowerCase();
      if (startsDark.indexOf(lower) >= 0) node.scheme = { name: name, extent: [0.15, 1] };
      else if (endsDark.indexOf(lower) >= 0) node.scheme = { name: name, extent: [0, 0.75] };
    }
    if ((node.type === 'point' || node.type === 'circle' || node.type === 'square') && typeof node.opacity === 'number' && node.opacity < 0.7) {
      node.opacity = Math.min(1, node.opacity + 0.25);
    }
    Object.keys(node).forEach(function (k) { if (k !== 'data' && k !== 'datasets') darken(node[k]); });
  }

  function target(el) {
    var view = el.querySelector(':scope > [data-phiz-view]');
    if (!view) {
      view = document.createElement('div');
      view.setAttribute('data-phiz-view', '');
      view.setAttribute('wire:ignore', '');
      el.appendChild(view);
    }
    return view;
  }

  function render(el) {
    var embed = Phiz.embed || window.vegaEmbed;
    if (!embed) { pending = true; return; }
    var json = el.getAttribute('data-phiz');
    var optionsJson = el.getAttribute('data-phiz-options') || '';
    var options = parse(optionsJson, {});
    var isDark = pageDark(options);
    var key = json + '\u0000' + optionsJson + '\u0000' + (isDark ? 'dark' : 'light');
    var state = views.get(el);
    if (state && state.key === key) return;
    var spec = parse(json, null);
    if (!spec) return;
    if (options.theme === 'auto') {
      if (isDark) options.theme = 'dark'; else delete options.theme;
    }
    if (isDark) {
      var variant = spec.usermeta && spec.usermeta.phiz && spec.usermeta.phiz.dark;
      if (variant) { spec.config = merge(spec.config, variant); darken(spec); }
      if (options.tooltip !== false) options.tooltip = merge({ theme: 'dark' }, typeof options.tooltip === 'object' ? options.tooltip : {});
    }
    if (state && state.view) state.view.finalize();
    // Each render draws into its own element, so a slow, superseded render cannot replace a newer chart.
    var token = {};
    var holder = document.createElement('div');
    target(el).appendChild(holder);
    views.set(el, { key: key, token: token, view: null });
    Promise.resolve(embed(holder, spec, options)).then(function (result) {
      var current = views.get(el);
      if (!current || current.token !== token) { result.view.finalize(); holder.remove(); return; }
      Array.prototype.slice.call(holder.parentNode.children).forEach(function (child) { if (child !== holder) child.remove(); });
      current.view = result.view;
      el.dispatchEvent(new CustomEvent('phiz:rendered', { detail: { view: result.view }, bubbles: true }));
    }).catch(function (error) {
      var current = views.get(el);
      if (!current || current.token !== token) { holder.remove(); return; }
      console.error('phiz:', error);
      holder.textContent = 'Chart error: ' + error.message;
    });
  }

  function load(el) {
    if (el.hasAttribute('data-phiz') || el.getAttribute('data-phiz-deferred') === 'loading') return;
    var link = el.querySelector('a[data-phiz-spec]');
    if (!link) return;
    el.setAttribute('data-phiz-deferred', 'loading');
    fetch(link.href).then(function (response) {
      if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
      return response.text();
    }).then(function (json) {
      el.setAttribute('data-phiz-deferred', 'loaded');
      el.setAttribute('data-phiz', json);
    }).catch(function (error) {
      el.setAttribute('data-phiz-deferred', 'failed');
      console.error('phiz: cannot load ' + link.href, error);
    });
  }

  var nearby = window.IntersectionObserver ? new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) { nearby.unobserve(entry.target); load(entry.target); }
    });
  }, { rootMargin: '200px' }) : null;

  function defer(el) {
    if (el.hasAttribute('data-phiz') || el.getAttribute('data-phiz-deferred')) return;
    if (nearby) nearby.observe(el); else load(el);
  }

  function scan(root) {
    if (root.nodeType !== 1) return;
    if (root.hasAttribute('data-phiz')) render(root);
    root.querySelectorAll('[data-phiz]').forEach(render);
    if (root.hasAttribute('data-phiz-deferred')) defer(root);
    root.querySelectorAll('[data-phiz-deferred]').forEach(defer);
  }

  function release(root) {
    if (root.nodeType !== 1) return;
    var nodes = root.hasAttribute('data-phiz') ? [root] : [];
    root.querySelectorAll('[data-phiz]').forEach(function (n) { nodes.push(n); });
    nodes.forEach(function (n) {
      if (n.isConnected) return;
      var state = views.get(n);
      if (state && state.view) state.view.finalize();
      views.delete(n);
    });
  }

  var pending = false;
  var Phiz = window.Phiz = {
    embed: null,
    render: render,
    scan: function () { scan(document.documentElement); },
    view: function (el) { var s = views.get(el); return s ? s.view : null; }
  };

  new MutationObserver(function (mutations) {
    mutations.forEach(function (m) {
      if (m.type === 'attributes') { render(m.target); return; }
      m.addedNodes.forEach(scan);
      m.removedNodes.forEach(release);
    });
  }).observe(document.documentElement, { subtree: true, childList: true, attributes: true, attributeFilter: ['data-phiz', 'data-phiz-options'] });

  if (dark && dark.addEventListener) dark.addEventListener('change', function () { Phiz.scan(); });
  // Redraw when the page's dark class changes.
  var wasDark = document.documentElement.classList.contains('dark');
  new MutationObserver(function () {
    var isDark = document.documentElement.classList.contains('dark');
    if (isDark !== wasDark) { wasDark = isDark; Phiz.scan(); }
  }).observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

  function start() { pending = false; Phiz.scan(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  window.addEventListener('load', function () { if (pending) start(); });
})();</script>
