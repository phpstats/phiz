project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "examples/*.qmd"
  resources:
    - figures/
    - gallery/
    - examples/

website:
  site-url: "https://phiz.phpstats.org/docs"
  title: "phiz"
  repo-url: https://github.com/phpstats/phiz
  repo-actions: [source, issue]
  sidebar:
    style: docked
    search: true
    contents:
      - section: "Getting started"
        contents:
          - index.qmd
          - get-started.qmd
          - ggplot2.qmd
      - section: "Guides"
        contents:
          - data.qmd
          - geoms.qmd
          - scales.qmd
          - facets.qmd
          - themes.qmd
          - interaction.qmd
          - statistics.qmd
          - rendering.qmd
          - laravel.qmd
          - dashboard.qmd
          - large-data.qmd
          - design.qmd
      - section: "Functions and methods"
        contents:
          - functions.qmd
          - reference.qmd
          - reference-plots.qmd
          - reference-geoms.qmd
          - reference-scales.qmd
          - reference-facets.qmd
          - reference-themes.qmd
          - reference-interaction.qmd
          - reference-output.qmd
          - reference-statistics.qmd
      - section: "Examples"
        contents:
          - examples/layers.qmd
          - examples/facets.qmd
          - examples/save.qmd
          - gallery.qmd
      - section: "Contributing"
        contents:
          - development.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    css: docs.css
    include-in-header: _phiz-scripts.html
