project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - gallery.html
    - figures/
    - examples/

website:
  site-url: "https://erikwestlund.github.io/phit/"
  title: "phit"
  repo-url: https://github.com/erikwestlund/phit
  repo-actions: [source, issue]
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - get-started.qmd
      - ggplot2.qmd
      - section: "Guide"
        contents:
          - data.qmd
          - geoms.qmd
          - scales.qmd
          - facets.qmd
          - themes.qmd
          - interaction.qmd
          - statistics.qmd
      - section: "Output"
        contents:
          - rendering.qmd
          - laravel.qmd
          - dashboard.qmd
          - large-data.qmd
      - href: gallery.html
        text: Gallery
      - section: "Project"
        contents:
          - design.qmd
          - reference.qmd
          - cmdstanphp.qmd
          - development.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    include-in-header: _phit-scripts.html
