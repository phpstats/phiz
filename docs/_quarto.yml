project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - figures/
    - gallery/
    - examples/

website:
  site-url: "https://phiz.phpstats.org/docs"
  title: "phiz"
  repo-url: https://github.com/phpstats/phiz
  repo-actions: [source, issue]
  sidebar:
    style: docked
    search: true
    contents:
      - index.qmd
      - section: "Getting started"
        contents:
          - get-started.qmd
          - ggplot2.qmd
      - section: "Guides"
        contents:
          - data.qmd
          - geoms.qmd
          - scales.qmd
          - facets.qmd
          - themes.qmd
          - interaction.qmd
          - statistics.qmd
          - rendering.qmd
          - laravel.qmd
          - dashboard.qmd
          - large-data.qmd
      - section: "Reference"
        contents:
          - reference.qmd
      - section: "Examples"
        contents:
          - gallery.qmd
      - section: "Compatibility and limitations"
        contents:
          - design.qmd
      - section: "Contributing"
        contents:
          - development.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    include-in-header: _phiz-scripts.html
